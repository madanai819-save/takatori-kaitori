<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>お問い合わせありがとうございます｜高価買取タカトル</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --navy:#131f3d;
  --navy-2:#1d2f57;
  --gold:#b6903f;
  --gold-light:#e3c98a;
  --white:#ffffff;
  --offwhite:#faf8f4;
  --accent:#d1481f;
  --accent-2:#e8663c;
  --text:#241f1a;
  --gray:#6c6660;
  --radius:18px;
  --shadow: 0 10px 30px -12px rgba(19,31,61,0.18);
}
*{box-sizing:border-box;}
body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Noto Sans JP','Hiragino Sans',sans-serif;
  color:var(--text);
  background:
    radial-gradient(1200px 600px at 20% -10%, rgba(182,144,63,0.25), transparent 60%),
    linear-gradient(160deg,var(--navy) 0%, var(--navy-2) 60%, #16264a 100%);
  line-height:1.8;
  padding:24px;
}
a:focus-visible, button:focus-visible{
  outline:3px solid var(--gold);
  outline-offset:2px;
}
.card{
  background:var(--white);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:40px 28px;
  max-width:480px;
  width:100%;
  text-align:center;
}
.brand{
  font-family:'Shippori Mincho',serif;
  color:var(--gold);
  font-weight:700;
  font-size:0.85rem;
  letter-spacing:0.1em;
  margin-bottom:18px;
}
h1{
  font-family:'Shippori Mincho',serif;
  color:var(--navy);
  font-size:1.4rem;
  margin:0 0 16px;
  line-height:1.5;
}
p{
  margin:0 0 12px;
  color:var(--text);
  font-size:0.95rem;
}
.tel-line{
  color:var(--gray);
  font-size:0.9rem;
  margin-bottom:28px;
}
.tel-line a{
  color:var(--accent);
  font-weight:700;
  text-decoration:none;
}
.btn-home{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:44px;
  padding:14px 28px;
  border-radius:999px;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));
  color:#fff;
  font-weight:700;
  font-size:0.95rem;
  text-decoration:none;
}
</style>
</head>
<body>
  <main class="card">
    <p class="brand">高価買取タカトル</p>
    <h1>お問い合わせありがとうございます</h1>
    <p>内容を確認のうえ、担当者よりご連絡いたします。</p>
    <p class="tel-line">お急ぎの場合は、<a href="tel:0728086532">072-808-6532</a>までお電話ください。</p>
    <a href="/" class="btn-home">トップページへ戻る</a>
  </main>
</body>
</html>
